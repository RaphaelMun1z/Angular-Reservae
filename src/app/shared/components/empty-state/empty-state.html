<section class="empty-state" aria-live="polite">
  @if (icon) { <div class="empty-state__icon" aria-hidden="true">{{ icon }}</div> }
  <h2>{{ title }}</h2>
  @if (description) { <p>{{ description }}</p> }
  @if (actionLabel) {
    @if (actionLink) {
      <a class="empty-state__action" [routerLink]="actionLink">{{ actionLabel }}</a>
    } @else {
      <button class="empty-state__action" type="button" (click)="action.emit()">{{ actionLabel }}</button>
    }
  }
</section>
